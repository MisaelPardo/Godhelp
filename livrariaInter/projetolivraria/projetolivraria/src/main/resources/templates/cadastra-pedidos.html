<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded shadow w-full max-w-3xl">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Novo Pedido</h2>
        <a th:href="@{/pedidos}" class="text-gray-500">Fechar</a>
    </div>

    <!-- Mensagem de erro de estoque vinda do Controller -->
    <div th:if="${erroEstoque}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <strong class="font-bold">Erro!</strong>
        <span class="block sm:inline" th:text="${erroEstoque}"></span>
    </div>

    <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post" id="pedidoForm">

        <div class="mb-4">
            <label>Cliente</label>
            <select th:field="*{clienteId}" required class="w-full border p-2 rounded">
                <option value="" disabled selected>-- Selecione um cliente --</option>
                <option th:each="c : ${listaClientes}" th:value="${c.idCliente}" th:text="${c.nome}"></option>
            </select>
        </div>

        <div class="mb-4">
            <label>Data do Pedido</label>
            <input type="date" th:field="*{dataPedido}" class="w-full border p-2 rounded"/>
        </div>

        <h3 class="font-bold mb-2">Itens</h3>

        <div class="flex gap-3 mb-4">
            <select id="livroSelect" class="border p-2 rounded w-2/3">
                <option value="" disabled selected>Selecione um livro</option>
                <!-- 
                     1. Adicionamos 'style' condicional para cor vermelha e negrito se estoque < 5.
                     2. Adicionamos texto condicional '(! REPOR ESTOQUE)' se estoque < 5.
                -->
                <option th:each="l : ${listaLivros}" 
                        th:value="${l.isbnLivro}" 
                        th:attr="data-preco=${l.preco}, data-estoque=${l.quantidadeEstoque}"
                        th:style="${l.quantidadeEstoque < 5} ? 'color: red; font-weight: bold;' : ''"
                        th:text="${l.nome} + ' (Estoque: ' + ${l.quantidadeEstoque} + ')' + (${l.quantidadeEstoque < 5} ? ' (! REPOR ESTOQUE)' : '')">
                </option>
            </select>

            <input id="quantidadeInput" type="number" min="1" placeholder="Qtd" class="border p-2 rounded w-1/6"/>

            <button type="button" onclick="addItem()" class="bg-green-600 text-white px-4 py-2 rounded">Adicionar</button>
        </div>

        <table class="w-full mb-4">
            <thead>
                <tr class="bg-gray-100">
                    <th class="p-2">Livro</th>
                    <th class="p-2">Qtd</th>
                    <th class="p-2">Preço unit.</th>
                    <th class="p-2">Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="itensTable"></tbody>
        </table>

        <div class="mb-4 text-right">
            <span class="font-bold">Total: </span>
            <span id="totalText">R$ 0,00</span>
        </div>

        <h3 class="font-bold mb-2">Pagamento</h3>
        
        <div class="mb-4">
            <label>Status</label>
            <select th:field="*{pagamentos[0].status}" class="w-full border p-2 rounded" required>
                <option value="" disabled selected>-- Selecione --</option>
                <option value="PENDENTE">Pendente</option>
                <option value="PAGO">Pago</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
        </div>

        <div class="mb-4">
            <label>Forma de Pagamento</label>
            <select th:field="*{pagamentos[0].formaPagamento}" class="w-full border p-2 rounded" required>
                <option value="" disabled selected>-- Selecione --</option>
                <option value="DINHEIRO">Dinheiro</option>
                <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                <option value="CARTAO_DEBITO">Cartão de Débito</option>
                <option value="PIX">PIX</option>
                <option value="BOLETO">Boleto</option>
            </select>
        </div>

        <div class="mb-4">
            <label>Valor Total</label>
            <input id="pagamentoValor" name="valor" type="number" step="0.01" readonly class="w-full border p-2 rounded"/>
        </div>

        <div class="mb-4">
            <label>Valor Pago</label>
            <input name="valorPago" type="number" step="0.01" class="w-full border p-2 rounded"/>
        </div>

        <div class="mb-4">
            <label>Data do Pagamento</label>
            <input name="dataPagamento" type="date" class="w-full border p-2 rounded"/>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Salvar Pedido</button>
        </div>
    </form>
</div>

<script>
    let itemIndex = 0;
    let total = 0.0;

    function toBRL(v) {
        return 'R$ ' + v.toFixed(2).replace('.', ',');
    }

    function addItem() {
        const livroSelect = document.getElementById('livroSelect');
        const qtdInput = document.getElementById('quantidadeInput');

        if (!livroSelect.value || !qtdInput.value || qtdInput.value <= 0) {
            alert('Selecione um livro e informe a quantidade.');
            return;
        }

        const isbn = livroSelect.value;
        const label = livroSelect.options[livroSelect.selectedIndex].text;
        const preco = parseFloat(livroSelect.options[livroSelect.selectedIndex].getAttribute('data-preco')) || 0;
        const estoque = parseInt(livroSelect.options[livroSelect.selectedIndex].getAttribute('data-estoque')) || 0;
        const quantidade = parseInt(qtdInput.value);

        if (quantidade > estoque) {
            alert('Quantidade indisponível! Estoque atual: ' + estoque);
            return;
        }

        const subtotal = preco * quantidade;
        total += subtotal;

        const tabela = document.getElementById('itensTable');
        const tr = document.createElement('tr');
        tr.setAttribute('data-subtotal', subtotal);

        // ALTERAÇÃO: Se o estoque for baixo, pinta a linha da tabela de vermelho claro
        if (estoque < 5) {
            tr.classList.add('text-red-600');
            tr.classList.add('bg-red-50');
            tr.title = "Item com estoque baixo!";
        }

        tr.innerHTML = `
            <td class="p-2">${label}</td>
            <td class="p-2">${quantidade}</td>
            <td class="p-2">R$ ${preco.toFixed(2).replace('.', ',')}</td>
            <td class="p-2">R$ ${subtotal.toFixed(2).replace('.', ',')}</td>

            <input type="hidden" name="itens[${itemIndex}].livro.isbnLivro" value="${isbn}">
            <input type="hidden" name="itens[${itemIndex}].quantidade" value="${quantidade}">
            <input type="hidden" name="itens[${itemIndex}].livro.preco" value="${preco}">

            <td class="p-2"><button type="button" class="text-red-600 hover:text-red-800" onclick="removeItem(this)">Remover</button></td>
        `;
        tabela.appendChild(tr);

        itemIndex++;
        livroSelect.selectedIndex = 0;
        qtdInput.value = '';
        updateTotalFields();
    }

    function removeItem(btn) {
        const tr = btn.closest('tr');
        const subtotal = parseFloat(tr.getAttribute('data-subtotal')) || 0;
        total -= subtotal;
        tr.remove();
        updateTotalFields();
    }

    function updateTotalFields() {
        if (total < 0) total = 0;
        document.getElementById('totalText').textContent = toBRL(total);
        document.getElementById('pagamentoValor').value = total.toFixed(2);
    }
    
    updateTotalFields();
</script>
</body>
</html>
