<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - Livraria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #D9B89C; }
        ::-webkit-scrollbar-thumb { background: #592202; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #A65C1C; }
    </style>
</head>
<body class="bg-[#D9B89C] min-h-screen font-sans text-[#260101]">

<nav class="bg-[#592202] border-b-4 border-[#A65C1C] shadow-lg p-4 mb-8">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <a th:href="@{/home}" class="font-extrabold text-xl text-[#D98E32] tracking-wide flex items-center gap-2 hover:text-white transition-colors">
            <i class="fa-solid fa-book-open"></i> Sistema Livraria
        </a>

        <div class="flex items-center gap-4">
            <a th:href="@{/pedidos/novo}" class="bg-[#A65C1C] hover:bg-[#D98E32] text-white px-4 py-2 rounded font-bold shadow-md hover:shadow-lg transition-all duration-200 flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Novo Pedido
            </a>
            <a th:href="@{/home}" class="flex items-center border border-[#D98E32] text-[#D98E32] hover:bg-[#D98E32] hover:text-[#592202] px-4 py-2 rounded transition duration-200 font-semibold">
                <i class="fas fa-arrow-left mr-2"></i> Voltar
            </a>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 pb-12">

    <!-- Campo de Busca -->
    <form th:action="@{/pedidos}" method="get" class="mb-6 flex flex-col sm:flex-row gap-4">
        <input 
            type="text" 
            name="busca" 
            placeholder="Pesquisar por Nome do Cliente" 
            th:value="${busca}"
            class="flex-grow p-3 border-2 border-[#A65C1C] rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-[#D98E32]"
        />
        <div class="flex gap-4">
            <button type="submit" class="bg-[#A65C1C] hover:bg-[#D98E32] text-white px-6 py-3 rounded-lg shadow-md font-bold transition-all duration-200 flex-shrink-0">
                <i class="fas fa-search"></i> Buscar
            </button>
            <a th:href="@{/pedidos}" class="border-2 border-[#592202] text-[#592202] hover:bg-[#592202] hover:text-white px-6 py-3 rounded-lg font-bold transition-all duration-200 flex items-center flex-shrink-0">
                <i class="fa-solid fa-eraser mr-2"></i> Limpar
            </a>
        </div>
    </form>

    <div class="bg-[#FFF8F0] shadow-2xl rounded-lg overflow-hidden border-2 border-[#A65C1C]">
        <table class="min-w-full divide-y divide-[#D9B89C]">
            <thead class="bg-[#592202]">
                <tr>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">ID</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Cliente</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Data</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Itens</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Total</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Status</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Forma</th>
                    <th class="p-4 text-left font-bold text-[#D98E32] tracking-wider uppercase text-sm">Ações</th>
                </tr>
            </thead>

            <tbody class="divide-y divide-[#D9B89C]">
                <tr th:each="p : ${pedidos}" class="hover:bg-[#D9B89C]/20 transition-colors">
                    <td class="p-4 font-semibold" th:text="${p.idPedido}"></td>
                    <td class="p-4 font-medium" th:text="${p.cliente != null ? p.cliente.nome : '—'}"></td>
                    <td class="p-4 text-[#592202]/80"
                        th:text="${p.dataPedido != null ? p.dataPedido.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : '—'}"></td>
                    <td class="p-4 text-sm" th:text="${p.totalItens} + ' itens'"></td>
                    <td class="p-4 font-bold text-[#A65C1C]"
                        th:text="${p.total != null ? 'R$ ' + #numbers.formatDecimal(p.total,1,'POINT',2,'COMMA') : 'R$ 0,00'}"></td>

                    <!-- Status -->
                    <td class="p-4">
                        <form th:action="@{/pedidos/atualizarStatus/{id}(id=${p.idPedido})}" method="post" class="flex items-center gap-2">
                            <select name="status" class="border border-[#A65C1C] bg-white text-[#592202] p-1 rounded text-sm focus:ring-2 focus:ring-[#D98E32] focus:outline-none">
                                <option value="PENDENTE" th:selected="${!#lists.isEmpty(p.pagamentos) ? p.pagamentos[0].status == 'PENDENTE' : true}">Pendente</option>
                                <option value="PAGO" th:selected="${!#lists.isEmpty(p.pagamentos) ? p.pagamentos[0].status == 'PAGO' : false}">Pago</option>
                                <option value="CANCELADO" th:selected="${!#lists.isEmpty(p.pagamentos) ? p.pagamentos[0].status == 'CANCELADO' : false}">Cancelado</option>
                            </select>
                            <button type="submit" class="bg-[#260101] text-[#D98E32] hover:bg-[#A65C1C] hover:text-white px-2 py-1 rounded text-xs uppercase font-bold transition-colors shadow-sm">Salvar</button>
                        </form>
                    </td>

                    <!-- Forma de Pagamento -->
                    <td class="p-4 text-sm text-[#592202]/70">
                        <span th:text="${!#lists.isEmpty(p.pagamentos) ? p.pagamentos[0].formaPagamento : 'A definir'}"></span>
                    </td>

                    <td class="p-4">
                        <a th:href="@{/pedidos/deletar/{id}(id=${p.idPedido})}" class="text-[#A65C1C] hover:text-red-600 font-semibold transition-colors flex items-center gap-1" onclick="return confirm('Excluir pedido permanentemente?')">
                           <i class="fa-solid fa-trash-can text-sm"></i> Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td class="p-8 text-center text-[#A65C1C] italic text-lg" colspan="8">
                        <i class="fa-solid fa-box-open mb-2 text-2xl"></i><br>
                        Nenhum pedido encontrado.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Footer simples para fechar a página -->
<footer class="text-center p-8 mt-4 text-sm text-[#592202] opacity-70">
    &copy; 2025 Livraria Projeto
</footer>

</body>
</html>
