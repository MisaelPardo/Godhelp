<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Dados do Cliente</h2>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{idCliente}" />

            <div>
                <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" th:field="*{nome}" required class="w-full border p-2 rounded"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">E-mail</label>
                <input type="email" th:field="*{email}" class="w-full border p-2 rounded"/>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">DDD</label>
                    <input type="text" th:field="*{ddd}" maxlength="4" class="w-full border p-2 rounded"/>
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Telefone</label>
                    <input type="text" th:field="*{telefone}" class="w-full border p-2 rounded"/>
                </div>
            </div>

            <div class="flex justify-end pt-4 space-x-2">
                <a th:href="@{/clientes}" class="px-4 py-2 bg-gray-300 text-gray-700 rounded">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
