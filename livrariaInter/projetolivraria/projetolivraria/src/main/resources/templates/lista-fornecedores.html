<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fornecedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Personalização da barra de rolagem */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #D9B89C; }
        ::-webkit-scrollbar-thumb { background: #592202; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #A65C1C; }
    </style>
</head>
<!-- Body: Fundo Bege (#D9B89C) e Texto Marrom Escuro (#260101) -->
<body class="bg-[#D9B89C] min-h-screen font-sans text-[#260101]">

<!-- Nav: Marrom Profundo (#592202) com borda Laranja (#A65C1C) -->
<nav class="bg-[#592202] border-b-4 border-[#A65C1C] shadow-lg px-6 py-4 mb-8">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <!-- Logo/Home: Ouro (#D98E32) -->
        <a th:href="@{/home}" class="font-extrabold text-2xl text-[#D98E32] hover:text-white transition-colors flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i> Sistema Livraria
        </a>

        <!-- Agrupamento dos botões à direita -->
        <div class="flex items-center gap-4">
            <!-- Botão Novo Fornecedor: Ouro (#D98E32) com texto escuro -->
            <a th:href="@{/fornecedores/novo}" class="bg-[#D98E32] text-[#260101] px-4 py-2 rounded font-bold shadow-md hover:bg-[#A65C1C] hover:text-white transition-all duration-300 transform hover:-translate-y-0.5 border border-[#A65C1C]">
                <i class="fa-solid fa-plus mr-2"></i>Novo Fornecedor
            </a>

            <!-- Botão Voltar -->
            <a th:href="@{/home}" class="flex items-center text-[#D9B89C] hover:text-white border border-[#D9B89C] hover:border-white px-4 py-2 rounded transition duration-200 font-semibold">
                <i class="fas fa-arrow-left mr-2"></i> Voltar 
            </a>
        </div>
    </div>
</nav>

<!-- Container Principal: Centraliza e limita a largura de TODO o conteúdo -->
<main class="max-w-7xl mx-auto px-6">
    
    <!-- Campo de Busca - Layout responsivo melhorado -->
    <form th:action="@{/fornecedores}" method="get" class="mb-6 flex flex-col sm:flex-row gap-4">
        <input 
            type="text" 
            name="busca" 
            placeholder="Pesquisar por Nome" 
            th:value="${busca}"
            class="flex-grow p-3 border-2 border-[#A65C1C] rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-[#D98E32]"
        />
        <div class="flex gap-4">
            <button type="submit" class="bg-[#A65C1C] hover:bg-[#D98E32] text-white px-6 py-3 rounded-lg shadow-md font-bold transition-all duration-200 flex-shrink-0">
                <i class="fas fa-search"></i> Buscar
            </button>
            <!-- Botão para Limpar a Busca -->
            <a th:href="@{/fornecedores}" class="border-2 border-[#592202] text-[#592202] hover:bg-[#592202] hover:text-white px-6 py-3 rounded-lg font-bold transition-all duration-200 flex items-center flex-shrink-0">
                <i class="fa-solid fa-eraser mr-2"></i> Limpar
            </a>
        </div>
    </form>
    
    <!-- Container da Tabela: Branco levemente "off-white" para leitura, com borda temática -->
    <div class="bg-white rounded-xl shadow-xl overflow-hidden border-2 border-[#A65C1C]">
        <table class="min-w-full divide-y divide-[#D9B89C]">
            <!-- Cabeçalho da Tabela: Marrom Escuro (#260101) e Texto Ouro (#D98E32) -->
            <thead class="bg-[#260101]">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-bold text-[#D98E32] uppercase tracking-wider w-16">ID</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-[#D98E32] uppercase tracking-wider">Nome</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-[#D98E32] uppercase tracking-wider">Telefone</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-[#D98E32] uppercase tracking-wider">CNPJ</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-[#D98E32] uppercase tracking-wider w-32">Ações</th>
                </tr>
            </thead>
            <!-- Corpo da Tabela -->
            <tbody class="divide-y divide-[#D9B89C]">
                <tr th:each="f : ${fornecedores}" class="hover:bg-[#FFF8F0] transition-colors">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-[#592202]" th:text="${f.idFornecedor}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[#260101]" th:text="${f.nome}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[#592202]" th:text="${f.ddd + ' ' + f.telefone}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[#592202]" th:text="${f.cnpj}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <!-- Ação de Excluir -->
                        <a th:href="@{/fornecedores/deletar/{id}(id=${f.idFornecedor})}" 
                           class="text-[#A65C1C] hover:text-red-700 transition-colors flex items-center gap-1" 
                           onclick="return confirm('Tem certeza que deseja excluir este fornecedor?')">
                           <i class="fa-solid fa-trash-can"></i> Excluir
                        </a>
                    </td>
                </tr>
                <!-- Estado Vazio -->
                <tr th:if="${#lists.isEmpty(fornecedores)}">
                    <td colspan="5" class="px-6 py-8 text-center text-[#A65C1C] italic text-lg">
                        <i class="fa-regular fa-folder-open mb-2 block text-2xl"></i>
                        Nenhum fornecedor cadastrado.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Footer simples para fechar a página -->
<footer class="text-center p-8 mt-4 text-sm text-[#592202] opacity-70">
    &copy; 2025 Livraria Projeto
</footer>

</body>
</html>
