<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livros</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow w-full max-w-2xl">
        <h2 class="text-2xl font-bold mb-4">Dados do Livro</h2>

        <form th:action="@{/livros/salvar}" th:object="${livroObj}" method="post" class="space-y-4">
            <div>
                <label>ISBN</label>
                <input type="text" th:field="*{isbnLivro}" required class="w-full border p-2 rounded"/>
            </div>

            <div>
                <label>Título</label>
                <input type="text" th:field="*{nome}" required class="w-full border p-2 rounded"/>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div><label>Autor</label><input type="text" th:field="*{autor}" class="w-full border p-2 rounded"/></div>
                <div><label>Preço</label><input type="number" step="0.01" th:field="*{preco}" class="w-full border p-2 rounded"/></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div><label>Estoque</label><input type="number" th:field="*{quantidadeEstoque}" min="0" class="w-full border p-2 rounded"/></div>
                <div><label>Categoria</label><input type="text" th:field="*{categoria}" class="w-full border p-2 rounded"/></div>
            </div>

            <div>
                <label>Fornecedor</label>
                <select th:field="*{fornecedor.idFornecedor}" required class="w-full border p-2 rounded">
                    <option value="" disabled selected>-- Selecione um fornecedor --</option>
                    <option th:each="f : ${listaFornecedores}" th:value="${f.idFornecedor}" th:text="${f.nome}"></option>
                </select>
            </div>

            <div class="flex justify-end">
                <a th:href="@{/livros}" class="px-4 py-2 bg-gray-300 rounded">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
