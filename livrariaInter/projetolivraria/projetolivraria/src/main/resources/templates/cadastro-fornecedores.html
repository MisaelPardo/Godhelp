<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Fornecedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded shadow w-full max-w-2xl">
        <h2 class="text-2xl font-bold mb-6">Fornecedor</h2>

        <form th:action="@{/fornecedores/salvar}" th:object="${fornecedor}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{idFornecedor}" />
            <div>
                <label>Nome</label>
                <input type="text" th:field="*{nome}" required class="w-full border p-2 rounded"/>
            </div>
            <div>
                <label>Endereço</label>
                <input type="text" th:field="*{endereco}" class="w-full border p-2 rounded"/>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div><label>DDD</label><input type="text" th:field="*{ddd}" class="w-full border p-2 rounded"/></div>
                <div><label>Telefone</label><input type="text" th:field="*{telefone}" class="w-full border p-2 rounded"/></div>
                <div><label>CNPJ</label><input type="text" th:field="*{cnpj}" class="w-full border p-2 rounded"/></div>
            </div>
            <div class="flex justify-end">
                <a th:href="@{/fornecedores}" class="px-4 py-2 bg-gray-300 rounded">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
