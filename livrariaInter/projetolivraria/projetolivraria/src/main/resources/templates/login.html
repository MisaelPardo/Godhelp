<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Livraria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .login-card {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<!-- Background alterado para o tom #D9B89C -->
<body class="bg-[#D9B89C] flex items-center justify-center h-screen font-sans">

    <!-- Card com borda sutil na cor #A65C1C e sombra colorida leve -->
    <div class="login-card bg-white p-10 rounded-xl shadow-2xl shadow-[#592202]/20 border border-[#A65C1C]/30 w-full max-w-md">
       
        <div class="text-center mb-8">
            <!-- Título na cor mais escura #260101 e Ícone na cor de destaque #D98E32 -->
            <h1 class="text-3xl font-extrabold text-[#260101] flex justify-center items-center gap-3">
                <i class="fa-solid fa-book-open text-3xl text-[#D98E32]"></i>
                <span> Sistema Livraria</span>
            </h1>
        </div>

        <!-- Mantive o vermelho/verde para feedback semântico, mas escureci o texto para combinar com o tema -->
        <div th:if="${param.error}" class="bg-red-50 border-l-4 border-red-500 text-[#592202] p-4 rounded mb-6 text-sm">
            <p class="font-bold text-red-700">Erro de acesso</p>
            <span>Usuário ou senha inválidos.</span>
        </div>

        <div th:if="${param.logout}" class="bg-green-50 border-l-4 border-green-500 text-[#592202] p-4 rounded mb-6 text-sm">
            <span>Você saiu do sistema com sucesso.</span>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-6">

            <div>
                <!-- Labels na cor #592202 -->
                <label for="username" class="block text-sm font-bold text-[#592202] mb-1">E-mail</label>
                <!-- Inputs: Borda #A65C1C, Foco #D98E32 e Texto Escuro -->
                <input type="email" id="username" name="username" required
                    class="w-full px-4 py-3 border border-[#A65C1C] rounded-lg shadow-sm placeholder-[#A65C1C]/50 text-[#260101] focus:outline-none focus:ring-2 focus:ring-[#D98E32] focus:border-transparent transition-all bg-white"
                    placeholder="exemplo@livraria.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-bold text-[#592202] mb-1">Senha</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 border border-[#A65C1C] rounded-lg shadow-sm placeholder-[#A65C1C]/50 text-[#260101] focus:outline-none focus:ring-2 focus:ring-[#D98E32] focus:border-transparent transition-all bg-white"
                    placeholder="********">
            </div>

            <!-- Botão: Fundo #592202, Hover #260101 (Mais escuro) -->
            <button type="submit"
                class="w-full flex justify-center py-3 px-4 rounded-lg shadow-lg text-sm font-bold text-white bg-[#592202] hover:bg-[#260101] hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 border border-[#260101]">
                Entrar no Sistema
            </button>
        </form>

        <!-- Rodapé na cor #A65C1C escurecida para leitura -->
        <div class="mt-8 text-center text-sm font-medium text-[#A65C1C] transition-colors hover:text-[#260101] cursor-default">
            &copy; 2025 Sistema Livraria
        </div>

    </div>
</body>
</html>
